<div class="message-panel" [style.background]="backgroundColor || 'transparent'">
  <div class="message-panel__scroll">
    <div *ngIf="!messages?.length" class="message-panel__empty">
      No messages yet.
    </div>

    <div
      *ngFor="let message of messages; let index = index"
      class="message-panel__row"
      [class.message-panel__row--self]="message.sender === username"
    >
      <div class="message-panel__meta">
        <span *ngIf="message.sender === username && !message.group" class="message-panel__sender">
          To: {{ message.receivers.join(', ') }}
        </span>
        <span *ngIf="message.sender !== username" class="message-panel__sender">
          {{ message.sender }}
        </span>
        <span class="message-panel__time">{{ message.timestamp }}</span>
        <button
          *ngIf="message.sender !== username && !message.group"
          type="button"
          class="message-panel__reply"
          (click)="openReplyInput(message.sender)"
          aria-label="Reply"
        >
          <fa-icon [icon]="faReply" size="xs"></fa-icon>
        </button>
      </div>

      <div class="message-panel__bubble" [class.message-panel__bubble--self]="message.sender === member">
        {{ message.message }}
      </div>
    </div>
  </div>

  <div *ngIf="replyInfo" class="message-panel__replying">
    <span>Replying to</span>
    <strong>{{ replyInfo.username }}</strong>
  </div>

  <div class="message-panel__composer">
    <input
      type="text"
      class="message-panel__input"
      [placeholder]="getComposerPlaceholder()"
      maxLength="350"
      (input)="handleTextInputChange($event)"
      [value]="type === 'direct' ? directMessageText : groupMessageText"
    />
    <button type="button" class="message-panel__send" (click)="handleSendButton()" aria-label="Send message">
      <fa-icon [icon]="faPaperPlane" size="sm"></fa-icon>
    </button>
  </div>
</div>
