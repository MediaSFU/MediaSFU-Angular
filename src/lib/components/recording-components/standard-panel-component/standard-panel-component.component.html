<section class="ms-recording-panel">
  <header class="ms-recording-panel__intro">
    <span class="ms-recording-panel__eyebrow">Capture basics</span>
    <h3 class="ms-recording-panel__title">Standard settings</h3>
    <p class="ms-recording-panel__copy">
      Choose the media mix and which parts of the room are included in the export.
    </p>
  </header>

  <div class="ms-recording-panel__stack">
    <label class="ms-recording-panel__field">
      <span class="ms-recording-panel__label">Media Options</span>
      <span class="ms-recording-panel__hint">Switch between a full video capture and an audio-only recording.</span>
      <select [(ngModel)]="selectedRecordingMediaOptions" (change)="handleMediaOptionsChange($event)">
        <option value="video">Record Video</option>
        <option value="audio">Record Audio Only</option>
      </select>
    </label>

    <ng-container *ngIf="parameters.eventType !== 'broadcast'">
      <label class="ms-recording-panel__field">
        <span class="ms-recording-panel__label">Specific Audios</span>
        <span class="ms-recording-panel__hint">Choose how much of the live audio mix should be captured.</span>
        <select [(ngModel)]="selectedRecordingAudioOptions" (change)="handleAudioOptionsChange($event)">
          <option value="all">Add All</option>
          <option value="onScreen">Add All On Screen</option>
          <option value="host">Add Host Only</option>
        </select>
      </label>

      <label id="conditionalConference" class="ms-recording-panel__field">
        <span class="ms-recording-panel__label">Specific Videos</span>
        <span class="ms-recording-panel__hint">Keep the full room visible or focus on the main presentation surface.</span>
        <select [(ngModel)]="selectedRecordingVideoOptions" (change)="handleVideoOptionsChange($event)">
          <option value="all">Add All</option>
          <option value="mainScreen">Big Screen Only (includes screenshare)</option>
        </select>
      </label>
    </ng-container>

    <label id="addHLSPart" class="ms-recording-panel__field">
      <span class="ms-recording-panel__label">Adaptive Streaming</span>
      <span class="ms-recording-panel__hint">Enable HLS packaging when the recording needs playback-ready streaming output.</span>
      <select [(ngModel)]="selectedRecordingAddHLS" (change)="handleAddHLSChange($event)">
        <option [ngValue]="true">Enabled</option>
        <option [ngValue]="false">Disabled</option>
      </select>
    </label>
  </div>
</section>
