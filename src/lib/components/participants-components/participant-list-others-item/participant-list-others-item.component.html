<div class="participant-readonly-item">
  <div class="participant-readonly-item__identity">
    <span class="participant-readonly-item__avatar">{{ participant.name.charAt(0).toUpperCase() }}</span>
    <span class="participant-readonly-item__name">
      {{ getParticipantDisplayName() }}
    </span>
  </div>
  <div class="participant-readonly-item__status" [class.participant-readonly-item__status--muted]="participant.muted">
    <fa-icon [icon]="faCircle"></fa-icon>
  </div>
</div>
