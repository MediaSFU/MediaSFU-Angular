<div class="participant-item">
  <div class="participant-item__identity">
    <span class="participant-item__avatar">{{ participant.name.charAt(0).toUpperCase() }}</span>
    <p class="participant-item__name">
      {{ participant.islevel === '2' ? participant.name + ' (host)' : participant.name }}
    </p>
  </div>
  <div *ngIf="!isBroadcast" class="participant-item__status" [class.participant-item__status--muted]="participant.muted">
    <fa-icon [icon]="faDotCircle"></fa-icon>
  </div>
  <div *ngIf="!isBroadcast" class="participant-item__actions">
    <button type="button" class="participant-item__button" (click)="muteParticipant()" aria-label="Toggle participant audio">
      <fa-icon [icon]="getIconName()"></fa-icon>
    </button>
    <button type="button" class="participant-item__button" (click)="messageParticipant()" aria-label="Message participant">
      <fa-icon [icon]="faComment"></fa-icon>
    </button>
  </div>
  <div class="participant-item__actions participant-item__actions--danger">
    <button type="button" class="participant-item__button participant-item__button--danger" (click)="removeParticipant()" aria-label="Remove participant">
      <fa-icon [icon]="faTrash"></fa-icon>
    </button>
  </div>
</div>
