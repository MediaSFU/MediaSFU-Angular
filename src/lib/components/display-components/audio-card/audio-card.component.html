<div
  class="card"
  [ngStyle]="customStyle"
  [style.background]="backgroundColor && backgroundColor !== 'transparent' ? backgroundColor : null"
  [class.card--dark]="isDarkModeEnabled"
  [class.card--light]="!isDarkModeEnabled"
  [class.card--speaking]="isSpeaking"
>
  <div class="card__body">
    <div class="card__avatar-shell">
      <div *ngIf="showWaveform" class="card__waveform-ring" aria-hidden="true">
        <div
          *ngFor="let ringIndex of ringBarIndices"
          class="card__waveform-ring-bar"
          [style.height.px]="getWaveformRingHeight(ringIndex)"
          [style.transform]="'rotate(' + (ringIndex * 40) + 'deg) translateY(-90px)'"
          [style.backgroundColor]="barColor"
        ></div>
      </div>

      <ng-container *ngIf="hasRenderableImage; else noImage">
        <div class="card__avatar-frame">
          <img
            [src]="imageSource"
            [ngStyle]="combineStyles(imageStyle, { 'border-radius': roundedImage ? '50%' : '22px' })"
            class="card__avatar-image"
            (error)="handleImageError()"
          />
          <span class="card__avatar-gloss" aria-hidden="true"></span>
        </div>
      </ng-container>
      <ng-template #noImage>
        <div class="card__avatar-frame">
          <app-modern-mini-card
            class="card__mini-card"
            [initials]="name"
            [fontSize]="24"
          ></app-modern-mini-card>
        </div>
      </ng-template>
    </div>
  </div>

  <span class="card__glass-overlay" aria-hidden="true"></span>

  <ng-container *ngIf="showInfo">
    <div
      class="card__overlay card__overlay--info"
      [ngStyle]="getOverlayPosition(infoPosition)"
      [ngClass]="showControls ? 'card__overlay--with-controls' : 'card__overlay--compact'"
    >
      <div class="card__identity">
        <span
          class="card__status-dot"
          [class.card__status-dot--muted]="participant?.muted"
          [class.card__status-dot--speaking]="isSpeaking"
        ></span>
        <p [ngStyle]="{ color: textColor }" class="card__name" [class.card__name--muted]="participant?.muted">
          {{ name }}
        </p>
      </div>
      <div *ngIf="showWaveform" class="card__waveform">
        <div
          *ngFor="let animation of waveformAnimations"
          class="card__bar"
          [style.height.px]="animation"
          [style.backgroundColor]="barColor"
        ></div>
      </div>
    </div>
  </ng-container>

  <ng-container *ngIf="renderControls()">
    <div
      class="card__overlay card__overlay--controls"
      [ngStyle]="getOverlayPosition(controlsPosition)"
      role="group"
      aria-label="Participant controls"
    >
      <ng-container *ngIf="!videoControlsComponent">
        <button
          type="button"
          class="card__control-button"
          (click)="toggleAudio()"
          [attr.aria-label]="participant?.muted ? 'Participant muted' : 'Mute participant'"
          [title]="participant?.muted ? 'Participant is muted' : 'Mute participant'"
        >
          <fa-icon
            [icon]="participant?.muted ? faMicrophoneSlash : faMicrophone"
            [style.color]="participant?.muted ? 'red' : 'green'"
          ></fa-icon>
        </button>
        <button
          type="button"
          class="card__control-button"
          (click)="toggleVideo()"
          [attr.aria-label]="participant?.['videoOn'] ? 'Turn off camera' : 'Camera is off'"
          [title]="participant?.['videoOn'] ? 'Turn off camera' : 'Camera is off'"
        >
          <fa-icon
            [icon]="participant?.['videoOn'] ? faVideo : faVideoSlash"
            [style.color]="participant?.['videoOn'] ? 'green' : 'red'"
          ></fa-icon>
        </button>
      </ng-container>
      <ng-container *ngIf="videoControlsComponent">
        <ng-container *ngIf="isCustomComponent(videoControlsComponent)">
          <ng-container
            *ngComponentOutlet="
              videoControlsComponent.component;
              injector: videoControlsComponent.injector
            "
          ></ng-container>
        </ng-container>
        <ng-container *ngIf="!isCustomComponent(videoControlsComponent)">
          <div [innerHTML]="videoControlsComponent.outerHTML"></div>
        </ng-container>
      </ng-container>
    </div>
  </ng-container>

  <app-subtitle-overlay [subtitle]="liveSubtitleText"></app-subtitle-overlay>
</div>
